[build]
  command = "bun run build"
  publish = "dist"

[[redirects]]
  from = "/fr/garden"
  to = "/garden"
  status = 301

[[redirects]]
  from = "/ascii"
  to = "/ascii/index.html"
  status = 200

[[redirects]]
  from = "/garden/*"
  to = "/garden/index.html"
  status = 200

[[redirects]]
  from = "/fr/*"
  to = "/fr/404.html"
  status = 404

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
